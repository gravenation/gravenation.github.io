<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GraveNation's Document-Site</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/buble.css">
</head>

<body>
  <nav>
     <a href="#/"
  </nav>
  <div id="app" align="center">Welcome from The Grave-Nation...</div>
  <script>
    window.$docsify = {
      // General
      themeColor: '#2585c4',
      search: 'auto',
      name: 'The Grave-Nation',
      repo: 'https://github.com/gravenation/gravenation.github.io',
      basePath: 'https://www.thesmos.asia',
      logo: '_media/avatar.png',
      homepage: 'index.md',
      coverpage: true,
      loadSidebar: 'summary.md',
      subMaxLevel: 3,
      loadNavbar: true,
      maxLevel: 6
      notFoundPage: false,
      ext: '.md',
    
      // Object
      markdown: {
         smartypants: true,
         renderer: {
           link: function () {
      // ...
        },
     
      // Function
      markdown: function (marked, renderer) {
         // ....
         return marked;
       },
    }
  </script>

  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search/min/js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//unpkg.com/docsify-footer-enh/dist/docsify-footer-enh.min.js"></script>

</body>
</html>
